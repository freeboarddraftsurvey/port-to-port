{"name":"Update NAVAREA warnings","on":{"schedule":[{"cron":"17 */6 * * *"}],"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"update":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Download SeaLagom NAVAREA feeds","run":"python3 -c \"import json,urllib.request;out={'source':'sealagom','feeds':{}}\nfor n in range(1,22):\n  try:\n    r=urllib.request.urlopen(urllib.request.Request('https://www.sealagom.com/feeds/navarea/%d.json'%n,headers={'User-Agent':'FreeboardPortToPort'}),timeout=60);out['feeds'][str(n)]=json.load(r);print(n,'ok',len(out['feeds'][str(n)].get('items',[])))\n  except Exception as e:print(n,'failed',e)\nassert out['feeds'],'no feed downloaded'\njson.dump(out,open('navwarn.json','w'))\""},{"name":"Save if changed","run":"git config user.name navwarn-bot && git config user.email navwarn-bot@users.noreply.github.com && git add navwarn.json && (git diff --cached --quiet || git commit -m 'Update NAVAREA warnings') && git push"}]}}}

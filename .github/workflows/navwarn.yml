{"name":"Update NAVAREA warnings","on":{"schedule":[{"cron":"17 */6 * * *"}],"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"update":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Download warnings from NGA","run":"curl -fsSL --retry 3 -A 'Mozilla/5.0' 'https://msi.nga.mil/api/publications/broadcast-warn?output=json&status=active' -o navwarn.tmp && python3 -c \"import json;d=json.load(open('navwarn.tmp'));assert isinstance(d.get('broadcast-warn'),list)\" && mv navwarn.tmp navwarn.json"},{"name":"Save if changed","run":"git config user.name navwarn-bot && git config user.email navwarn-bot@users.noreply.github.com && git add navwarn.json && (git diff --cached --quiet || git commit -m 'Update NAVAREA warnings') && git push"}]}}}

{"name":"Update NAVAREA warnings","on":{"schedule":[{"cron":"17 */6 * * *"}],"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"update":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Download warnings (NGA, then relays)","run":"U='https://msi.nga.mil/api/publications/broadcast-warn?output=json&status=active'; E=$(python3 -c \"import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))\" \"$U\"); for S in \"$U\" \"https://api.allorigins.win/raw?url=$E\" \"https://api.codetabs.com/v1/proxy/?quest=$E\" \"https://corsproxy.io/?url=$E\"; do echo \"Trying $S\"; if curl -sSL --max-time 60 --retry 2 -A 'Mozilla/5.0 (FreeboardPortToPort)' -H 'Accept: application/json' \"$S\" -o navwarn.tmp && python3 -c \"import json;d=json.load(open('navwarn.tmp'));assert isinstance(d.get('broadcast-warn'),list);print(len(d['broadcast-warn']),'warnings')\"; then mv navwarn.tmp navwarn.json; echo OK; exit 0; fi; echo 'failed, next source'; head -c 300 navwarn.tmp 2>/dev/null; echo; done; echo 'All sources failed'; exit 1"},{"name":"Save if changed","run":"git config user.name navwarn-bot && git config user.email navwarn-bot@users.noreply.github.com && git add navwarn.json && (git diff --cached --quiet || git commit -m 'Update NAVAREA warnings') && git push"}]}}}
